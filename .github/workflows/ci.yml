name: CIRQL CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci --include=optional

      - name: Run backend test suite
        working-directory: server
        env:
          NODE_ENV: test
          MONGOMS_VERSION: 7.0.14
        run: npm test

  frontend-checks:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --include=optional

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        run: npm run build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/cirql_e2e
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci_access_secret_for_testing_only_2026
      JWT_REFRESH_SECRET: ci_refresh_secret_for_testing_only_2026
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: server
        run: npm ci --include=optional

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --include=optional

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Start backend server
        working-directory: server
        run: |
          npm start > "$RUNNER_TEMP/cirql-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cirql-server.pid"

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/api/health; then
              echo "Backend is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to start."
          cat "$RUNNER_TEMP/cirql-server.log"
          exit 1

      - name: Run Playwright tests
        working-directory: client
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show backend logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/cirql-server.log"

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: cirql-server:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: false
          tags: cirql-client:ci
          build-args: |
            VITE_API_URL=http://localhost:5000/api
            VITE_SOCKET_URL=http://localhost:5000
  deploy-render:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
      - e2e-tests
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not configured. Deployment skipped."
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

          echo "Render deployment triggered successfully."
